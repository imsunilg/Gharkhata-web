@if (quickAdd.isOpen()) {
  <div class="backdrop">
    <button type="button" class="scrim" aria-label="Close" (click)="close()"></button>
    <div
      class="sheet"
      role="dialog"
      aria-modal="true"
      aria-label="Quick add expense"
      (keydown.escape)="close()"
    >
      <div class="grabber"></div>

      <input
        #smart
        class="smart"
        type="text"
        [ngModel]="raw()"
        (ngModelChange)="onType($event)"
        (keydown.enter)="save()"
        placeholder="e.g. ₹450 groceries, or 850 petrol"
        aria-label="Type or say it in one line"
        autocomplete="off"
      />
      @if (parseHint()) {
        <p class="hint" aria-live="polite">{{ parseHint() }}</p>
      }

      <label class="amount-field">
        <span>Amount</span>
        <div class="amount">
          <span class="rs">₹</span>
          <input
            type="number"
            inputmode="decimal"
            [ngModel]="amount()"
            (ngModelChange)="amount.set($event)"
            (keydown.enter)="save()"
          />
        </div>
      </label>

      <label class="row">
        <span>What was it for?</span>
        <input type="text" [ngModel]="title()" (ngModelChange)="title.set($event)" placeholder="Title" />
      </label>

      <div class="pills" role="group" aria-label="Category">
        @for (c of reference.activeCategories(); track c.id) {
          <button
            type="button"
            class="pill"
            [class.on]="categoryId() === c.id"
            [style.--dot]="c.colour"
            (click)="pickCategory(c.id!)"
          >
            {{ c.name }}
          </button>
        }
      </div>

      <div class="two">
        <label>
          <span>Paid by</span>
          <select [ngModel]="paidBy()" (ngModelChange)="paidBy.set($event)">
            @for (m of reference.members(); track m.id) {
              <option [value]="m.id">{{ m.displayName }}</option>
            }
          </select>
        </label>
        <label>
          <span>Payment</span>
          <select [ngModel]="paymentMethod()" (ngModelChange)="paymentMethod.set($event)">
            @for (pm of reference.paymentMethods(); track pm) {
              <option [value]="pm">{{ pm }}</option>
            }
          </select>
        </label>
      </div>

      <div class="two">
        <label>
          <span>Account</span>
          <select [ngModel]="accountId()" (ngModelChange)="accountId.set($event)">
            <option [ngValue]="null">—</option>
            @for (a of reference.accounts(); track a.id) {
              <option [value]="a.id">{{ a.name }}</option>
            }
          </select>
        </label>
        <div class="date">
          <span>Date</span>
          <div class="seg">
            <button type="button" [class.on]="dateChoice() === 'today'" (click)="dateChoice.set('today')">Today</button>
            <button type="button" [class.on]="dateChoice() === 'yesterday'" (click)="dateChoice.set('yesterday')">Yesterday</button>
          </div>
        </div>
      </div>

      <div class="seg vis" role="group" aria-label="Visibility">
        <button type="button" [class.on]="visibility() === 'Family'" (click)="visibility.set('Family')">Family expense</button>
        <button type="button" [class.on]="visibility() === 'Personal'" (click)="visibility.set('Personal')">Personal expense</button>
      </div>

      <button type="button" class="save" [disabled]="!canSave()" (click)="save()">
        {{ saving() ? 'Saving…' : 'Save Expense' }}
      </button>
    </div>
  </div>
}
